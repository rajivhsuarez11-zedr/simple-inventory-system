<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Operations</p>
          <h1>Inventory Manager</h1>
        </div>
        <button id="resetDataBtn" class="secondary-btn">Reset Demo Data</button>
      </header>

      <section class="stats-grid">
        <article class="stat-card accent-blue">
          <span>Total Items</span>
          <strong id="totalItems">0</strong>
        </article>
        <article class="stat-card accent-green">
          <span>Units in Stock</span>
          <strong id="totalUnits">0</strong>
        </article>
        <article class="stat-card accent-orange">
          <span>Low Stock</span>
          <strong id="lowStockCount">0</strong>
        </article>
        <article class="stat-card accent-purple">
          <span>Inventory Value</span>
          <strong id="inventoryValue">$0.00</strong>
        </article>
      </section>

      <main class="content-grid">
        <section class="panel form-panel">
          <h2>Add Product</h2>
          <form id="inventoryForm">
            <div class="form-row">
              <label>
                Product Name
                <input type="text" id="name" placeholder="e.g. Notebook" required />
              </label>
            </div>

            <div class="form-row two-cols">
              <label>
                SKU
                <input type="text" id="sku" placeholder="e.g. NB-1001" required />
              </label>
              <label>
                Category
                <input type="text" id="category" placeholder="e.g. Office" required />
              </label>
            </div>

            <div class="form-row two-cols">
              <label>
                Quantity
                <input type="number" id="quantity" min="0" value="0" required />
              </label>
              <label>
                Price
                <input type="number" id="price" min="0" step="0.01" value="0" required />
              </label>
            </div>

            <button type="submit" class="primary-btn">Add Product</button>
          </form>
        </section>

        <section class="panel inventory-panel">
          <div class="panel-header">
            <h2>Inventory</h2>
            <div class="search-wrap">
              <input type="search" id="searchInput" placeholder="Search products" />
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Product</th>
                  <th>SKU</th>
                  <th>Category</th>
                  <th>Qty</th>
                  <th>Price</th>
                  <th>Value</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="inventoryTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <template id="inventoryRowTemplate">
      <tr>
        <td class="product-cell">
          <div class="product-name"></div>
        </td>
        <td class="sku-cell"></td>
        <td class="category-cell"></td>
        <td class="qty-cell"></td>
        <td class="price-cell"></td>
        <td class="value-cell"></td>
        <td class="actions-cell">
          <div class="action-group">
            <button class="small-btn decrease-btn" type="button" aria-label="Decrease stock">-</button>
            <button class="small-btn increase-btn" type="button" aria-label="Increase stock">+</button>
            <button class="small-btn delete-btn" type="button" aria-label="Delete product">Delete</button>
          </div>
        </td>
      </tr>
    </template>

    <script src="app.js"></script>
  </body>
</html>
